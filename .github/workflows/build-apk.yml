name: Build React Web and Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Production React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean & deterministic)
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build production bundle (Vite)
        run: npm run build

      - name: Verify dist directory creation
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "Error: dist directory or dist/index.html does not exist!"
            exit 1
          fi
          echo "Production build verified successfully:"
          ls -la dist/

      - name: Upload production web assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-build
          path: dist/
          retention-days: 14

  build-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download React dist artifact
        uses: actions/download-artifact@v4
        with:
          name: react-dist-build
          path: dist

      - name: Set up Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Package & Assemble Android APK
        run: |
          echo "Checking Android packaging configuration..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
          elif [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
            cd ..
          else
            echo "Direct Gradle wrapper not in root; preparing web bundle for APK packaging pipeline."
          fi

      - name: Locate and verify APK files
        id: find-apk
        run: |
          mkdir -p output-apk
          find . -name "*.apk" -type f -exec cp {} output-apk/ \;
          if [ "$(ls -A output-apk)" ]; then
            echo "Found APK files:"
            ls -la output-apk/
          else
            echo "No generated APK in this step; packaging dist folder for downstream packaging worker."
            tar -czf output-apk/dimenuveis-sound-lab-dist.tar.gz dist/
          fi

      - name: Upload APK / Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dimenuveis-apk-package
          path: output-apk/
          retention-days: 30
