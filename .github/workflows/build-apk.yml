name: Build React Web and Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-web:
    name: Build Production React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean & deterministic)
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build production bundle (Vite)
        run: npm run build

      - name: Verify dist directory creation
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "Error: dist directory or dist/index.html does not exist!"
            exit 1
          fi
          echo "Production build verified successfully:"
          ls -la dist/

      - name: Upload production web assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-build
          path: dist/
          retention-days: 14

  build-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download React dist artifact
        uses: actions/download-artifact@v4
        with:
          name: react-dist-build
          path: dist

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Copy React dist into Android assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/
          cp -r dist/* android/app/src/main/assets/dist/
          echo "Verified assets placed into android project:"
          ls -la android/app/src/main/assets/

      - name: Build Android APK with Gradle Wrapper
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Generated APK
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} output-apk/ \;
          echo "Final APK artifacts collected:"
          ls -la output-apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimenuveis-sound-lab-apk
          path: output-apk/
          retention-days: 30
